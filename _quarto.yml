project:
  type: book
  output-dir: docs

  preview:
    watch-inputs: true
    navigate: true
    browser: true

book:
  title: "Fundamentos para Inferência Causal"
  subtitle: "Notas de Aula"

  search: true

  sidebar:
    style: docked
    collapse-level: 1

  chapters:
    - index.qmd
    - conteudo.qmd
    - chapters/motivacao.qmd
  #  - chapters/00-1_pre_requisitos_matematicos.qmd

    - part: "Prelúdio"
      chapters:
        - chapters/00-2_preludio_01.qmd
        - chapters/00-2_preludio_02.qmd
        - chapters/00-2_preludio_03.qmd

    - part: "Módulo 1 — Probabilidade"
      chapters:
        - chapters/01_da_incerteza_a_probabilidade.qmd
        - chapters/02_construindo_um_modelo_probabilistico.qmd
      #  - chapters/03_quando_o_espaco_amostral_e_continuo.qmd
      #  - chapters/04_espaco_de_amostragem.qmd

format:
  html:
    theme: flatly
    css: styles.css

    toc: true
    toc-location: right
    toc-depth: 3

    code-link: true
    code-copy: true

    fontsize: 1.1em
    linestretch: 1.6

    grid:
      sidebar-width: 280px
      body-width: 950px
      margin-width: 280px
      gutter-width: 1.5rem

number-sections: false

lang: pt-BR
